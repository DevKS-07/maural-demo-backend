name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generate Prisma client — needed if any test imports the real client
      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Unit tests only — integration tests need a live database
      - name: Unit tests
        run: npm run test:ci
