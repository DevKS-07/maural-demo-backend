<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" rx="16" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="38" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5">KEY CHALLENGES SOLVED</text>

  <!-- Challenge 1: Cross-Domain Auth -->
  <g filter="url(#shadow)">
    <rect x="24" y="60" width="328" height="185" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="24" y="60" width="4" height="185" rx="2" fill="#dc2626"/>
    <rect x="44" y="76" width="64" height="22" rx="4" fill="rgba(220,38,38,0.1)"/>
    <text x="76" y="91" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">HARDEST</text>
    <text x="44" y="120" font-size="16" font-weight="700" fill="#1e293b">Cross-Domain Auth</text>
    <text x="44" y="142" font-size="12.5" fill="#64748b">Browser redirects to /install don't</text>
    <text x="44" y="158" font-size="12.5" fill="#64748b">carry JWT across domains — silent</text>
    <text x="44" y="174" font-size="12.5" fill="#64748b">401 failures in production.</text>
    <rect x="44" y="190" width="288" height="38" rx="6" fill="rgba(22,163,74,0.06)"/>
    <text x="56" y="208" font-size="11" font-weight="600" fill="#16a34a">Fix:</text>
    <text x="80" y="208" font-size="11" fill="#1e293b">Return JSON from install endpoints;</text>
    <text x="56" y="222" font-size="11" fill="#1e293b">frontend handles the redirect</text>
  </g>

  <!-- Challenge 2: Token Expiry -->
  <g filter="url(#shadow)">
    <rect x="368" y="60" width="328" height="185" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="368" y="60" width="4" height="185" rx="2" fill="#d97706"/>
    <rect x="388" y="76" width="66" height="22" rx="4" fill="rgba(217,119,6,0.1)"/>
    <text x="421" y="91" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">COMPLEX</text>
    <text x="388" y="120" font-size="16" font-weight="700" fill="#1e293b">Token Expiry Mid-Request</text>
    <text x="388" y="142" font-size="12.5" fill="#64748b">HubSpot tokens expire while</text>
    <text x="388" y="158" font-size="12.5" fill="#64748b">paginating through 1000+ records</text>
    <text x="388" y="174" font-size="12.5" fill="#64748b">— data fetch fails halfway.</text>
    <rect x="388" y="190" width="288" height="38" rx="6" fill="rgba(22,163,74,0.06)"/>
    <text x="400" y="208" font-size="11" font-weight="600" fill="#16a34a">Fix:</text>
    <text x="424" y="208" font-size="11" fill="#1e293b">Auto-refresh on 401 with single retry;</text>
    <text x="400" y="222" font-size="11" fill="#1e293b">restart full pagination</text>
  </g>

  <!-- Challenge 3: Rate Limits -->
  <g filter="url(#shadow)">
    <rect x="24" y="262" width="328" height="195" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="24" y="262" width="4" height="195" rx="2" fill="#7c3aed"/>
    <rect x="44" y="278" width="66" height="22" rx="4" fill="rgba(124,58,237,0.1)"/>
    <text x="77" y="293" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">COMPLEX</text>
    <text x="44" y="322" font-size="16" font-weight="700" fill="#1e293b">Per-Provider Rate Limits</text>
    <text x="44" y="344" font-size="12.5" fill="#64748b">Each API has different limits.</text>
    <text x="44" y="360" font-size="12.5" fill="#64748b">ClickUp requires per-user fetching</text>
    <text x="44" y="376" font-size="12.5" fill="#64748b">— can't batch by workspace.</text>
    <rect x="44" y="392" width="288" height="50" rx="6" fill="rgba(22,163,74,0.06)"/>
    <text x="56" y="410" font-size="11" font-weight="600" fill="#16a34a">Fix:</text>
    <text x="80" y="410" font-size="11" fill="#1e293b">Batch 10 members at a time with</text>
    <text x="56" y="426" font-size="11" fill="#1e293b">600ms delays; Retry-After backoff on 429s</text>
  </g>

  <!-- Challenge 4: Labor Source Conflicts -->
  <g filter="url(#shadow)">
    <rect x="368" y="262" width="328" height="195" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="368" y="262" width="4" height="195" rx="2" fill="#16a34a"/>
    <rect x="388" y="278" width="66" height="22" rx="4" fill="rgba(22,163,74,0.1)"/>
    <text x="421" y="293" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">SOLVED</text>
    <text x="388" y="322" font-size="16" font-weight="700" fill="#1e293b">Labor Source Conflicts</text>
    <text x="388" y="344" font-size="12.5" fill="#64748b">Connecting Monday after ClickUp</text>
    <text x="388" y="360" font-size="12.5" fill="#64748b">silently overwrote the active labor</text>
    <text x="388" y="376" font-size="12.5" fill="#64748b">source — user data disappeared.</text>
    <rect x="388" y="392" width="288" height="50" rx="6" fill="rgba(22,163,74,0.06)"/>
    <text x="400" y="410" font-size="11" font-weight="600" fill="#16a34a">Fix:</text>
    <text x="424" y="410" font-size="11" fill="#1e293b">Skip auto-config if source already set;</text>
    <text x="400" y="426" font-size="11" fill="#1e293b">manual override via settings endpoint</text>
  </g>
</svg>
