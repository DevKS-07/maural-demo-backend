<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-scatter" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1100" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="center-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="600" rx="0" fill="url(#bg-grad)"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- LEFT SIDE: The Problem (scattered)      -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Section label -->
  <rect x="30" y="16" width="120" height="28" rx="6" fill="rgba(220,38,38,0.1)"/>
  <text x="90" y="35" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">THE PROBLEM</text>

  <!-- Scattered lines (chaos visual) -->
  <line x1="80" y1="200" x2="200" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="320" y1="100" x2="180" y2="260" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="220" x2="100" y2="320" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="380" x2="350" y2="420" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="280" y1="340" x2="420" y2="130" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- QuickBooks floating card -->
  <g filter="url(#shadow)" transform="rotate(-4, 100, 120)">
    <rect x="40" y="70" width="180" height="110" rx="10" fill="white" stroke="#2ca01c" stroke-width="1.5"/>
    <rect x="40" y="70" width="180" height="32" rx="10" fill="#2ca01c"/>
    <rect x="40" y="90" width="180" height="12" fill="#2ca01c"/>
    <text x="130" y="92" font-size="12" font-weight="700" fill="white" text-anchor="middle">QuickBooks</text>
    <!-- Mini chart bars -->
    <rect x="60" y="126" width="14" height="36" rx="2" fill="rgba(44,160,28,0.2)"/>
    <rect x="80" y="116" width="14" height="46" rx="2" fill="rgba(44,160,28,0.3)"/>
    <rect x="100" y="132" width="14" height="30" rx="2" fill="rgba(44,160,28,0.2)"/>
    <rect x="120" y="110" width="14" height="52" rx="2" fill="rgba(44,160,28,0.4)"/>
    <rect x="140" y="122" width="14" height="40" rx="2" fill="rgba(44,160,28,0.25)"/>
    <!-- Labels -->
    <text x="170" y="124" font-size="8" fill="#64748b">Revenue</text>
    <text x="170" y="136" font-size="8" fill="#64748b">P&amp;L</text>
    <text x="170" y="148" font-size="8" fill="#64748b">Cash Flow</text>
  </g>

  <!-- Monday.com floating card -->
  <g filter="url(#shadow)" transform="rotate(3, 330, 90)">
    <rect x="260" y="58" width="180" height="110" rx="10" fill="white" stroke="#ff3d57" stroke-width="1.5"/>
    <rect x="260" y="58" width="180" height="32" rx="10" fill="#ff3d57"/>
    <rect x="260" y="78" width="180" height="12" fill="#ff3d57"/>
    <text x="350" y="80" font-size="12" font-weight="700" fill="white" text-anchor="middle">monday.com</text>
    <!-- Mini board rows -->
    <rect x="278" y="104" width="70" height="10" rx="3" fill="rgba(255,61,87,0.15)"/>
    <rect x="354" y="104" width="30" height="10" rx="3" fill="#22c55e"/>
    <rect x="278" y="120" width="70" height="10" rx="3" fill="rgba(255,61,87,0.15)"/>
    <rect x="354" y="120" width="30" height="10" rx="3" fill="#f59e0b"/>
    <rect x="278" y="136" width="70" height="10" rx="3" fill="rgba(255,61,87,0.15)"/>
    <rect x="354" y="136" width="30" height="10" rx="3" fill="#3b82f6"/>
    <text x="400" y="114" font-size="8" fill="#64748b">Tasks</text>
    <text x="400" y="130" font-size="8" fill="#64748b">Time</text>
    <text x="400" y="146" font-size="8" fill="#64748b">Hours</text>
  </g>

  <!-- HubSpot floating card -->
  <g filter="url(#shadow)" transform="rotate(-2, 180, 280)">
    <rect x="50" y="230" width="180" height="110" rx="10" fill="white" stroke="#ff7a59" stroke-width="1.5"/>
    <rect x="50" y="230" width="180" height="32" rx="10" fill="#ff7a59"/>
    <rect x="50" y="250" width="180" height="12" fill="#ff7a59"/>
    <text x="140" y="252" font-size="12" font-weight="700" fill="white" text-anchor="middle">HubSpot</text>
    <!-- Mini pipeline -->
    <rect x="68" y="278" width="50" height="10" rx="3" fill="rgba(255,122,89,0.3)"/>
    <rect x="68" y="294" width="38" height="10" rx="3" fill="rgba(255,122,89,0.4)"/>
    <rect x="68" y="310" width="24" height="10" rx="3" fill="rgba(255,122,89,0.5)"/>
    <!-- Funnel labels -->
    <text x="128" y="288" font-size="8" fill="#64748b">Leads</text>
    <text x="128" y="304" font-size="8" fill="#64748b">Proposals</text>
    <text x="128" y="320" font-size="8" fill="#64748b">Won</text>
  </g>

  <!-- ClickUp floating card -->
  <g filter="url(#shadow)" transform="rotate(5, 380, 310)">
    <rect x="270" y="250" width="180" height="110" rx="10" fill="white" stroke="#7b68ee" stroke-width="1.5"/>
    <rect x="270" y="250" width="180" height="32" rx="10" fill="#7b68ee"/>
    <rect x="270" y="270" width="180" height="12" fill="#7b68ee"/>
    <text x="360" y="272" font-size="12" font-weight="700" fill="white" text-anchor="middle">ClickUp</text>
    <!-- Mini task list -->
    <circle cx="292" cy="300" r="5" fill="none" stroke="#7b68ee" stroke-width="1.5"/>
    <text x="304" y="304" font-size="9" fill="#1e293b">Time entries</text>
    <circle cx="292" cy="318" r="5" fill="#7b68ee"/>
    <text x="304" y="322" font-size="9" fill="#1e293b">Workspace data</text>
    <circle cx="292" cy="336" r="5" fill="none" stroke="#7b68ee" stroke-width="1.5"/>
    <text x="304" y="340" font-size="9" fill="#1e293b">Member hours</text>
  </g>

  <!-- Documents floating card -->
  <g filter="url(#shadow)" transform="rotate(-3, 300, 450)">
    <rect x="150" y="400" width="180" height="100" rx="10" fill="white" stroke="#d97706" stroke-width="1.5"/>
    <rect x="150" y="400" width="180" height="32" rx="10" fill="#d97706"/>
    <rect x="150" y="420" width="180" height="12" fill="#d97706"/>
    <text x="240" y="422" font-size="12" font-weight="700" fill="white" text-anchor="middle">Documents / Files</text>
    <!-- Mini folder icons -->
    <rect x="170" y="448" width="28" height="22" rx="3" fill="rgba(217,119,6,0.15)" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <rect x="170" y="444" width="14" height="6" rx="2" fill="rgba(217,119,6,0.25)"/>
    <rect x="206" y="448" width="28" height="22" rx="3" fill="rgba(217,119,6,0.15)" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <rect x="206" y="444" width="14" height="6" rx="2" fill="rgba(217,119,6,0.25)"/>
    <rect x="242" y="448" width="28" height="22" rx="3" fill="rgba(217,119,6,0.15)" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <rect x="242" y="444" width="14" height="6" rx="2" fill="rgba(217,119,6,0.25)"/>
    <rect x="278" y="448" width="28" height="22" rx="3" fill="rgba(217,119,6,0.15)" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <rect x="278" y="444" width="14" height="6" rx="2" fill="rgba(217,119,6,0.25)"/>
    <text x="170" y="488" font-size="8" fill="#64748b">Scattered across drives,</text>
    <text x="170" y="498" font-size="8" fill="#64748b">emails, and local storage</text>
  </g>

  <!-- Frustrated person icon (center-left) -->
  <g transform="translate(240, 380)">
    <!-- Head -->
    <circle cx="0" cy="0" r="16" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Frustrated face -->
    <circle cx="-5" cy="-3" r="2" fill="#92400e"/>
    <circle cx="5" cy="-3" r="2" fill="#92400e"/>
    <path d="M-6,6 Q0,2 6,6" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Stress lines -->
    <line x1="-22" y1="-10" x2="-28" y2="-16" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-18" y1="-18" x2="-22" y2="-26" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="-10" x2="28" y2="-16" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="-18" x2="22" y2="-26" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <text x="240" y="428" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">"Where is that data?"</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- CENTER: Divider                         -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Vertical divider -->
  <line x1="500" y1="50" x2="500" y2="550" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Arrow from left chaos to right solution -->
  <g>
    <rect x="472" y="270" width="56" height="56" rx="28" fill="white" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="304" font-size="24" text-anchor="middle" fill="#2563eb">&#x27A1;</text>
  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- RIGHT SIDE: The Solution (unified)      -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Section label -->
  <rect x="940" y="16" width="140" height="28" rx="6" fill="rgba(37,99,235,0.1)"/>
  <text x="1010" y="35" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">THE SOLUTION</text>

  <!-- Central hub glow -->
  <circle cx="780" cy="290" r="120" fill="rgba(37,99,235,0.03)" stroke="rgba(37,99,235,0.08)" stroke-width="1"/>
  <circle cx="780" cy="290" r="85" fill="rgba(37,99,235,0.05)" stroke="rgba(37,99,235,0.12)" stroke-width="1"/>

  <!-- Central Maural KMS box -->
  <g filter="url(#shadow)">
    <rect x="710" y="240" width="140" height="100" rx="16" fill="url(#center-grad)"/>
    <text x="780" y="274" font-size="16" font-weight="800" fill="white" text-anchor="middle">Maural</text>
    <text x="780" y="294" font-size="14" font-weight="600" fill="rgba(255,255,255,0.85)" text-anchor="middle">KMS</text>
    <text x="780" y="320" font-size="9" fill="rgba(255,255,255,0.65)" text-anchor="middle">Centralized Dashboard</text>
  </g>

  <!-- Connected sources (orbiting the center) -->

  <!-- QuickBooks node -->
  <line x1="640" y1="120" x2="730" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="580" y="80" width="120" height="50" rx="10" fill="white" stroke="#2ca01c" stroke-width="1.5"/>
    <rect x="596" y="94" width="22" height="22" rx="6" fill="#2ca01c"/>
    <text x="607" y="110" font-size="11" font-weight="800" fill="white" text-anchor="middle">Q</text>
    <text x="626" y="110" font-size="12" font-weight="600" fill="#1e293b">QuickBooks</text>
  </g>

  <!-- Monday node -->
  <line x1="880" y1="120" x2="820" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="840" y="80" width="120" height="50" rx="10" fill="white" stroke="#ff3d57" stroke-width="1.5"/>
    <rect x="856" y="94" width="22" height="22" rx="6" fill="#ff3d57"/>
    <text x="867" y="110" font-size="11" font-weight="800" fill="white" text-anchor="middle">M</text>
    <text x="886" y="110" font-size="12" font-weight="600" fill="#1e293b">Monday</text>
  </g>

  <!-- HubSpot node -->
  <line x1="620" y1="440" x2="726" y2="338" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="560" y="434" width="120" height="50" rx="10" fill="white" stroke="#ff7a59" stroke-width="1.5"/>
    <rect x="576" y="448" width="22" height="22" rx="6" fill="#ff7a59"/>
    <text x="587" y="464" font-size="11" font-weight="800" fill="white" text-anchor="middle">H</text>
    <text x="606" y="464" font-size="12" font-weight="600" fill="#1e293b">HubSpot</text>
  </g>

  <!-- ClickUp node -->
  <line x1="900" y1="440" x2="828" y2="338" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="860" y="434" width="120" height="50" rx="10" fill="white" stroke="#7b68ee" stroke-width="1.5"/>
    <rect x="876" y="448" width="22" height="22" rx="6" fill="#7b68ee"/>
    <text x="887" y="464" font-size="11" font-weight="800" fill="white" text-anchor="middle">C</text>
    <text x="906" y="464" font-size="12" font-weight="600" fill="#1e293b">ClickUp</text>
  </g>

  <!-- Documents node -->
  <line x1="780" y1="510" x2="780" y2="342" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="710" y="510" width="140" height="50" rx="10" fill="white" stroke="#d97706" stroke-width="1.5"/>
    <rect x="726" y="524" width="22" height="22" rx="6" fill="#d97706"/>
    <text x="737" y="540" font-size="11" font-weight="800" fill="white" text-anchor="middle">D</text>
    <text x="756" y="540" font-size="12" font-weight="600" fill="#1e293b">Documents</text>
  </g>

  <!-- Happy person icon (bottom-right of hub) -->
  <g transform="translate(780, 182)">
    <circle cx="0" cy="0" r="16" fill="#86efac" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="-5" cy="-3" r="2" fill="#166534"/>
    <circle cx="5" cy="-3" r="2" fill="#166534"/>
    <path d="M-6,4 Q0,9 6,4" fill="none" stroke="#166534" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <text x="780" y="216" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600">"Everything in one place"</text>

  <!-- Bottom labels -->
  <text x="240" y="548" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">Data scattered across 5 platforms</text>
  <text x="240" y="568" font-size="12" fill="#64748b" text-anchor="middle">Manual tracking, context switching, no unified view</text>

  <text x="780" y="578" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">One dashboard, real-time KPIs, AI-powered insights</text>
</svg>
