<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" rx="16" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="38" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5">ENGINEERING EFFORT — BY THE NUMBERS</text>

  <!-- Stat 1 -->
  <g filter="url(#shadow)">
    <rect x="24" y="60" width="155" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="101" y="104" font-size="38" font-weight="800" fill="#2563eb" text-anchor="middle">4</text>
    <text x="101" y="124" font-size="12" fill="#64748b" text-anchor="middle">OAuth2 Integrations</text>
    <text x="101" y="140" font-size="10" fill="#94a3b8" text-anchor="middle">Each with unique quirks</text>
  </g>

  <!-- Stat 2 -->
  <g filter="url(#shadow)">
    <rect x="195" y="60" width="155" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="272" y="104" font-size="38" font-weight="800" fill="#2563eb" text-anchor="middle">15+</text>
    <text x="272" y="124" font-size="12" fill="#64748b" text-anchor="middle">KPIs Extracted</text>
    <text x="272" y="140" font-size="10" fill="#94a3b8" text-anchor="middle">Cross-source calculations</text>
  </g>

  <!-- Stat 3 -->
  <g filter="url(#shadow)">
    <rect x="366" y="60" width="155" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="443" y="104" font-size="38" font-weight="800" fill="#2563eb" text-anchor="middle">6hr</text>
    <text x="443" y="124" font-size="12" fill="#64748b" text-anchor="middle">Cache TTL</text>
    <text x="443" y="140" font-size="10" fill="#94a3b8" text-anchor="middle">Stale-while-revalidate</text>
  </g>

  <!-- Stat 4 -->
  <g filter="url(#shadow)">
    <rect x="537" y="60" width="155" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="614" y="104" font-size="38" font-weight="800" fill="#2563eb" text-anchor="middle">0</text>
    <text x="614" y="124" font-size="12" fill="#64748b" text-anchor="middle">Cross-Org Leakage</text>
    <text x="614" y="140" font-size="10" fill="#94a3b8" text-anchor="middle">Full tenant isolation</text>
  </g>

  <!-- Design decisions checklist -->
  <g filter="url(#shadow)">
    <rect x="24" y="190" width="672" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="44" y="216" font-size="13" font-weight="700" fill="#1e293b">Key Design Decisions</text>

    <!-- Row 1 -->
    <circle cx="54" cy="244" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="54" y="248" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="72" y="249" font-size="12.5" fill="#1e293b">Automatic token refresh</text>

    <circle cx="270" cy="244" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="270" y="248" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="288" y="249" font-size="12.5" fill="#1e293b">Smart labor source routing</text>

    <circle cx="500" cy="244" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="500" y="248" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="518" y="249" font-size="12.5" fill="#1e293b">Per-org credential isolation</text>

    <!-- Row 2 -->
    <circle cx="54" cy="274" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="54" y="278" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="72" y="279" font-size="12.5" fill="#1e293b">Graceful degradation</text>

    <circle cx="270" cy="274" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="270" y="278" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="288" y="279" font-size="12.5" fill="#1e293b">Zero-config auto-detection</text>

    <circle cx="500" cy="274" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="500" y="278" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="518" y="279" font-size="12.5" fill="#1e293b">Rate-limit aware batching</text>
  </g>
</svg>
