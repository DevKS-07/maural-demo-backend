<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="340" rx="16" fill="#ffffff"/>

  <!-- HubSpot Card -->
  <g filter="url(#shadow)">
    <rect x="24" y="20" width="250" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="44" y="40" width="48" height="48" rx="12" fill="#ff7a59"/>
    <text x="68" y="72" font-size="22" font-weight="800" fill="white" text-anchor="middle">H</text>
    <text x="44" y="116" font-size="19" font-weight="700" fill="#1e293b">HubSpot</text>
    <text x="44" y="138" font-size="12" fill="#64748b">CRM Integration</text>
    <text x="44" y="162" font-size="12.5" fill="#64748b">Pulls lead, deal, and pipeline</text>
    <text x="44" y="178" font-size="12.5" fill="#64748b">data for sales performance KPIs</text>

    <rect x="44" y="200" width="88" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="88" y="216" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Leads Created</text>
    <rect x="138" y="200" width="76" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="176" y="216" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Deals Won</text>
    <rect x="44" y="230" width="100" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="94" y="246" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Conversion Rate</text>
    <rect x="150" y="230" width="100" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="200" y="246" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Pipeline Value</text>
  </g>

  <!-- QuickBooks Card -->
  <g filter="url(#shadow)">
    <rect x="292" y="20" width="250" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="312" y="40" width="48" height="48" rx="12" fill="#2ca01c"/>
    <text x="336" y="72" font-size="22" font-weight="800" fill="white" text-anchor="middle">Q</text>
    <text x="312" y="116" font-size="19" font-weight="700" fill="#1e293b">QuickBooks</text>
    <text x="312" y="138" font-size="12" fill="#64748b">Financial Integration</text>
    <text x="312" y="162" font-size="12.5" fill="#64748b">Extracts P&amp;L, balance sheet,</text>
    <text x="312" y="178" font-size="12.5" fill="#64748b">cash flow, and EBITDA metrics</text>

    <rect x="312" y="200" width="66" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="345" y="216" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Revenue</text>
    <rect x="384" y="200" width="60" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="414" y="216" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">EBITDA</text>
    <rect x="312" y="230" width="76" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="350" y="246" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Cash Flow</text>
    <rect x="394" y="230" width="82" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="435" y="246" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Labor Cost</text>
  </g>

  <!-- Monday Card -->
  <g filter="url(#shadow)">
    <rect x="560" y="20" width="250" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="580" y="40" width="48" height="48" rx="12" fill="#ff3d57"/>
    <text x="604" y="72" font-size="22" font-weight="800" fill="white" text-anchor="middle">M</text>
    <text x="580" y="116" font-size="19" font-weight="700" fill="#1e293b">Monday.com</text>
    <text x="580" y="138" font-size="12" fill="#64748b">Labor Tracking</text>
    <text x="580" y="162" font-size="12.5" fill="#64748b">Reads time entries from boards</text>
    <text x="580" y="178" font-size="12.5" fill="#64748b">to calculate utilization &amp; FTEs</text>

    <rect x="580" y="200" width="88" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="624" y="216" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Labor Hours</text>
    <rect x="674" y="200" width="92" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="720" y="216" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Billable FTEs</text>
    <rect x="580" y="230" width="94" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="627" y="246" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Utilization %</text>
  </g>

  <!-- ClickUp Card -->
  <g filter="url(#shadow)">
    <rect x="828" y="20" width="250" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="848" y="40" width="48" height="48" rx="12" fill="#7b68ee"/>
    <text x="872" y="72" font-size="22" font-weight="800" fill="white" text-anchor="middle">C</text>
    <text x="848" y="116" font-size="19" font-weight="700" fill="#1e293b">ClickUp</text>
    <text x="848" y="138" font-size="12" fill="#64748b">Labor Tracking</text>
    <text x="848" y="162" font-size="12.5" fill="#64748b">Fetches per-member time entries</text>
    <text x="848" y="178" font-size="12.5" fill="#64748b">with rate-limit aware batching</text>

    <rect x="848" y="200" width="88" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="892" y="216" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Labor Hours</text>
    <rect x="942" y="200" width="92" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="988" y="216" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Billable FTEs</text>
    <rect x="848" y="230" width="94" height="24" rx="12" fill="rgba(37,99,235,0.08)"/>
    <text x="895" y="246" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">Utilization %</text>
  </g>
</svg>
