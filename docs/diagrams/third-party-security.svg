<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="420" rx="16" fill="#ffffff"/>

  <!-- Title -->
  <text x="460" y="36" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5">THIRD-PARTY SERVICES — SECURITY-DRIVEN CHOICES</text>
  <text x="460" y="56" font-size="13" fill="#64748b" text-anchor="middle">Every external service was chosen with security and compliance as a primary factor</text>

  <!-- Clerk -->
  <g filter="url(#shadow)">
    <rect x="30" y="78" width="270" height="152" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="30" y="78" width="270" height="48" rx="12" fill="#6c47ff"/>
    <rect x="30" y="102" width="270" height="24" fill="#6c47ff"/>
    <text x="50" y="108" font-size="17" font-weight="700" fill="white">Clerk</text>
    <text x="200" y="108" font-size="11" fill="rgba(255,255,255,0.8)">Authentication</text>

    <text x="50" y="148" font-size="12.5" font-weight="600" fill="#1e293b">Why Clerk?</text>
    <text x="50" y="168" font-size="12" fill="#64748b">SOC 2 Type II certified. Handles</text>
    <text x="50" y="184" font-size="12" fill="#64748b">JWT issuance, MFA enforcement,</text>
    <text x="50" y="200" font-size="12" fill="#64748b">and user lifecycle — so we don't</text>
    <text x="50" y="216" font-size="12" fill="#64748b">store or manage passwords.</text>
  </g>

  <!-- Supabase -->
  <g filter="url(#shadow)">
    <rect x="325" y="78" width="270" height="152" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="325" y="78" width="270" height="48" rx="12" fill="#3ecf8e"/>
    <rect x="325" y="102" width="270" height="24" fill="#3ecf8e"/>
    <text x="345" y="108" font-size="17" font-weight="700" fill="white">Supabase</text>
    <text x="480" y="108" font-size="11" fill="rgba(255,255,255,0.85)">Database &amp; Storage</text>

    <text x="345" y="148" font-size="12.5" font-weight="600" fill="#1e293b">Why Supabase?</text>
    <text x="345" y="168" font-size="12" fill="#64748b">PostgreSQL with encryption at rest,</text>
    <text x="345" y="184" font-size="12" fill="#64748b">private storage buckets per org,</text>
    <text x="345" y="200" font-size="12" fill="#64748b">Row-Level Security capabilities,</text>
    <text x="345" y="216" font-size="12" fill="#64748b">and pgvector for secure embeddings.</text>
  </g>

  <!-- Ollama -->
  <g filter="url(#shadow)">
    <rect x="620" y="78" width="270" height="152" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="620" y="78" width="270" height="48" rx="12" fill="#1e293b"/>
    <rect x="620" y="102" width="270" height="24" fill="#1e293b"/>
    <text x="640" y="108" font-size="17" font-weight="700" fill="white">Ollama</text>
    <text x="776" y="108" font-size="11" fill="rgba(255,255,255,0.8)">AI / LLM</text>

    <text x="640" y="148" font-size="12.5" font-weight="600" fill="#1e293b">Why local LLM?</text>
    <text x="640" y="168" font-size="12" fill="#64748b">Runs entirely on our infrastructure.</text>
    <text x="640" y="184" font-size="12" fill="#64748b">No client data is ever sent to</text>
    <text x="640" y="200" font-size="12" fill="#64748b">third-party AI services — full data</text>
    <text x="640" y="216" font-size="12" fill="#64748b">sovereignty and privacy.</text>
  </g>

  <!-- Security measures row -->
  <text x="460" y="260" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">HOW WE SECURE THE CONNECTIONS</text>

  <g filter="url(#shadow)">
    <rect x="30" y="278" width="200" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="50" y="298" width="36" height="36" rx="8" fill="rgba(37,99,235,0.1)"/>
    <text x="68" y="322" font-size="18" text-anchor="middle">&#x1F512;</text>
    <text x="50" y="354" font-size="13" font-weight="700" fill="#1e293b">OAuth2 Tokens</text>
    <text x="50" y="372" font-size="11.5" fill="#64748b">Scoped per-org, auto-refresh,</text>
    <text x="50" y="388" font-size="11.5" fill="#64748b">10-min state TTL, CSRF-safe</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="278" width="200" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="270" y="298" width="36" height="36" rx="8" fill="rgba(37,99,235,0.1)"/>
    <text x="288" y="322" font-size="18" text-anchor="middle">&#x1F6E1;</text>
    <text x="270" y="354" font-size="13" font-weight="700" fill="#1e293b">Webhook Verification</text>
    <text x="270" y="372" font-size="11.5" fill="#64748b">Svix HMAC-SHA256 signature</text>
    <text x="270" y="388" font-size="11.5" fill="#64748b">on all Clerk webhooks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="278" width="200" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="490" y="298" width="36" height="36" rx="8" fill="rgba(37,99,235,0.1)"/>
    <text x="508" y="322" font-size="18" text-anchor="middle">&#x1F6AB;</text>
    <text x="490" y="354" font-size="13" font-weight="700" fill="#1e293b">Strict CORS</text>
    <text x="490" y="372" font-size="11.5" fill="#64748b">Explicit origin whitelist,</text>
    <text x="490" y="388" font-size="11.5" fill="#64748b">no wildcard (*) allowed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="278" width="200" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="710" y="298" width="36" height="36" rx="8" fill="rgba(37,99,235,0.1)"/>
    <text x="728" y="322" font-size="18" text-anchor="middle">&#x1F9F1;</text>
    <text x="710" y="354" font-size="13" font-weight="700" fill="#1e293b">Helmet Headers</text>
    <text x="710" y="372" font-size="11.5" fill="#64748b">CSP, X-Frame-Options,</text>
    <text x="710" y="388" font-size="11.5" fill="#64748b">X-Content-Type, and more</text>
  </g>
</svg>
