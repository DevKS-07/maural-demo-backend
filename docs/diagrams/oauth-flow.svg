<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" rx="16" fill="#ffffff"/>

  <!-- Title -->
  <text x="410" y="38" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5">OAUTH2 AUTHORIZATION FLOW</text>

  <!-- ═══ Left side: Steps ═══ -->

  <!-- Step 1 -->
  <circle cx="60" cy="94" r="22" fill="#2563eb"/>
  <text x="60" y="100" font-size="15" font-weight="700" fill="white" text-anchor="middle">1</text>
  <text x="96" y="89" font-size="15" font-weight="700" fill="#1e293b">User Clicks "Connect"</text>
  <text x="96" y="107" font-size="12" fill="#64748b">Frontend sends authenticated request</text>

  <line x1="60" y1="118" x2="60" y2="152" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Step 2 -->
  <circle cx="60" cy="174" r="22" fill="#2563eb"/>
  <text x="60" y="180" font-size="15" font-weight="700" fill="white" text-anchor="middle">2</text>
  <text x="96" y="169" font-size="15" font-weight="700" fill="#1e293b">State Token Generated</text>
  <text x="96" y="187" font-size="12" fill="#64748b">Random state for CSRF protection</text>

  <line x1="60" y1="198" x2="60" y2="232" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Step 3 -->
  <circle cx="60" cy="254" r="22" fill="#2563eb"/>
  <text x="60" y="260" font-size="15" font-weight="700" fill="white" text-anchor="middle">3</text>
  <text x="96" y="249" font-size="15" font-weight="700" fill="#1e293b">Provider Authorization</text>
  <text x="96" y="267" font-size="12" fill="#64748b">User logs in &amp; grants permission</text>

  <line x1="60" y1="278" x2="60" y2="312" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Step 4 -->
  <circle cx="60" cy="334" r="22" fill="#2563eb"/>
  <text x="60" y="340" font-size="15" font-weight="700" fill="white" text-anchor="middle">4</text>
  <text x="96" y="329" font-size="15" font-weight="700" fill="#1e293b">Token Exchange</text>
  <text x="96" y="347" font-size="12" fill="#64748b">Code exchanged for access &amp; refresh tokens</text>

  <line x1="60" y1="358" x2="60" y2="392" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Step 5 -->
  <circle cx="60" cy="414" r="22" fill="#2563eb"/>
  <text x="60" y="420" font-size="15" font-weight="700" fill="white" text-anchor="middle">5</text>
  <text x="96" y="409" font-size="15" font-weight="700" fill="#1e293b">Secure Storage &amp; Auto-Config</text>
  <text x="96" y="427" font-size="12" fill="#64748b">Tokens stored per-org, auto-detect boards</text>

  <!-- ═══ Right side: Network diagram ═══ -->
  <g filter="url(#shadow)">
    <!-- Frontend box -->
    <rect x="520" y="76" width="130" height="48" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="585" y="105" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Frontend</text>

    <!-- Arrow down -->
    <line x1="585" y1="124" x2="585" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="605" y="148" font-size="10" fill="#64748b">JWT</text>

    <!-- Backend box -->
    <rect x="520" y="168" width="130" height="48" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="585" y="197" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Backend API</text>

    <!-- Arrow right to provider -->
    <line x1="650" y1="192" x2="694" y2="192" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Provider box -->
    <rect x="698" y="168" width="90" height="48" rx="8" fill="#2563eb" stroke="none"/>
    <text x="743" y="190" font-size="12" font-weight="600" fill="white" text-anchor="middle">OAuth</text>
    <text x="743" y="206" font-size="12" font-weight="600" fill="white" text-anchor="middle">Provider</text>

    <!-- Arrow down from backend -->
    <line x1="585" y1="216" x2="585" y2="264" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="605" y="244" font-size="10" fill="#64748b">Store</text>

    <!-- Database box -->
    <rect x="530" y="268" width="110" height="44" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
    <text x="585" y="295" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Token DB</text>

    <!-- Arrow from provider back to backend (dashed) -->
    <path d="M743,216 L743,248 L650,248" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
    <text x="700" y="240" font-size="10" fill="#64748b">Code</text>
  </g>

  <!-- ═══ Bottom: Key features box ═══ -->
  <g filter="url(#shadow)">
    <rect x="460" y="348" width="330" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <circle cx="488" cy="374" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="488" y="378" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="506" y="378" font-size="12" font-weight="600" fill="#1e293b">Automatic token refresh on expiry</text>

    <circle cx="488" cy="400" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="488" y="404" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="506" y="404" font-size="12" font-weight="600" fill="#1e293b">Per-organization token isolation</text>

    <circle cx="488" cy="426" r="10" fill="rgba(22,163,74,0.1)"/>
    <text x="488" y="430" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">&#x2713;</text>
    <text x="506" y="430" font-size="12" font-weight="600" fill="#1e293b">Zero manual configuration needed</text>
  </g>

  <!-- ═══ Bottom note bar ═══ -->
  <rect x="38" y="470" width="744" height="44" rx="8" fill="rgba(37,99,235,0.06)"/>
  <text x="410" y="488" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="500">Each provider has unique quirks:</text>
  <text x="410" y="504" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="500">ClickUp tokens don't expire  |  Monday may omit refresh tokens  |  QuickBooks needs a realmId</text>
</svg>
