<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" rx="16" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5">DATA FLOW — FROM INTEGRATIONS TO DASHBOARD</text>

  <!-- Source boxes (left) -->
  <g filter="url(#shadow)">
    <rect x="30" y="60" width="140" height="52" rx="10" fill="#fff5f0" stroke="#ff7a59" stroke-width="1.5"/>
    <rect x="42" y="72" width="28" height="28" rx="6" fill="#ff7a59"/>
    <text x="56" y="92" font-size="14" font-weight="800" fill="white" text-anchor="middle">H</text>
    <text x="80" y="91" font-size="14" font-weight="600" fill="#1e293b">HubSpot</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="126" width="140" height="52" rx="10" fill="#f0fdf0" stroke="#2ca01c" stroke-width="1.5"/>
    <rect x="42" y="138" width="28" height="28" rx="6" fill="#2ca01c"/>
    <text x="56" y="158" font-size="14" font-weight="800" fill="white" text-anchor="middle">Q</text>
    <text x="80" y="157" font-size="14" font-weight="600" fill="#1e293b">QuickBooks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="192" width="140" height="52" rx="10" fill="#fff0f2" stroke="#ff3d57" stroke-width="1.5"/>
    <rect x="42" y="204" width="28" height="28" rx="6" fill="#ff3d57"/>
    <text x="56" y="224" font-size="14" font-weight="800" fill="white" text-anchor="middle">M</text>
    <text x="80" y="223" font-size="14" font-weight="600" fill="#1e293b">Monday</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="258" width="140" height="52" rx="10" fill="#f3f0ff" stroke="#7b68ee" stroke-width="1.5"/>
    <rect x="42" y="270" width="28" height="28" rx="6" fill="#7b68ee"/>
    <text x="56" y="290" font-size="14" font-weight="800" fill="white" text-anchor="middle">C</text>
    <text x="80" y="289" font-size="14" font-weight="600" fill="#1e293b">ClickUp</text>
  </g>

  <!-- "OR" indicator between Monday and ClickUp -->
  <rect x="155" y="229" width="28" height="18" rx="4" fill="rgba(37,99,235,0.1)"/>
  <text x="169" y="242" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">OR</text>

  <!-- Arrows from sources to services -->
  <line x1="170" y1="86" x2="248" y2="106" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="152" x2="248" y2="152" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="218" x2="248" y2="198" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="284" x2="248" y2="198" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- Service boxes (middle) -->
  <g filter="url(#shadow)">
    <rect x="252" y="80" width="150" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="327" y="103" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">Leads Service</text>
    <text x="327" y="118" font-size="10" fill="#64748b" text-anchor="middle">Contacts, deals, pipeline</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="252" y="140" width="150" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="327" y="163" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">Finance Service</text>
    <text x="327" y="178" font-size="10" fill="#64748b" text-anchor="middle">P&amp;L, balance sheet, cash</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="252" y="200" width="150" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="327" y="223" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">Labor Router</text>
    <text x="327" y="238" font-size="10" fill="#64748b" text-anchor="middle">Smart source selection</text>
  </g>

  <!-- Arrows from services to engine -->
  <line x1="402" y1="105" x2="478" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="402" y1="165" x2="478" y2="165" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="402" y1="225" x2="478" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Engine controller (center-right) -->
  <g filter="url(#shadow)">
    <rect x="482" y="130" width="160" height="70" rx="12" fill="#2563eb"/>
    <text x="562" y="162" font-size="15" font-weight="700" fill="white" text-anchor="middle">Engine Controller</text>
    <text x="562" y="182" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Promise.allSettled()</text>
  </g>

  <!-- Arrow to cache -->
  <line x1="642" y1="165" x2="700" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="642" y1="165" x2="700" y2="195" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Cache box -->
  <g filter="url(#shadow)">
    <rect x="704" y="108" width="160" height="52" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
    <text x="784" y="131" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">KPI Cache</text>
    <text x="784" y="148" font-size="10" fill="#64748b" text-anchor="middle">6-hour TTL, auto-refresh</text>
  </g>

  <!-- Dashboard box -->
  <g filter="url(#shadow)">
    <rect x="704" y="174" width="160" height="52" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="784" y="197" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">Dashboard API</text>
    <text x="784" y="214" font-size="10" fill="#64748b" text-anchor="middle">Unified JSON response</text>
  </g>

  <!-- Bottom cross-source note -->
  <rect x="220" y="280" width="460" height="44" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="450" y="300" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Cross-Source KPI Example</text>
  <text x="450" y="316" font-size="11.5" fill="#64748b" text-anchor="middle">Labor Cost/Hr = QuickBooks Labor Cost ÷ Monday/ClickUp Direct Hours</text>

  <!-- Legend -->
  <text x="50" y="352" font-size="10" fill="#64748b">Solid line = primary data flow</text>
  <line x1="210" y1="348" x2="240" y2="348" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="248" y="352" font-size="10" fill="#64748b">Dashed = alternative source (Monday OR ClickUp)</text>
</svg>
