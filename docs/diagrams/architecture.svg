<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="500" rx="16" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="38" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5">SYSTEM ARCHITECTURE</text>

  <!-- Layer 1: Middleware -->
  <g filter="url(#shadow)">
    <rect x="40" y="58" width="680" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="60" y="78" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">MIDDLEWARE</text>

    <rect x="60" y="90" width="120" height="30" rx="6" fill="rgba(217,119,6,0.1)"/>
    <text x="120" y="110" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">Clerk Auth (JWT)</text>

    <rect x="192" y="90" width="130" height="30" rx="6" fill="rgba(217,119,6,0.1)"/>
    <text x="257" y="110" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">Org Isolation</text>

    <rect x="334" y="90" width="140" height="30" rx="6" fill="rgba(217,119,6,0.1)"/>
    <text x="404" y="110" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">Role-Based Access</text>

    <rect x="486" y="90" width="130" height="30" rx="6" fill="rgba(217,119,6,0.1)"/>
    <text x="551" y="110" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">CORS Handling</text>
  </g>

  <!-- Arrow -->
  <line x1="380" y1="132" x2="380" y2="156" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Controllers -->
  <g filter="url(#shadow)">
    <rect x="40" y="160" width="680" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="60" y="180" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">CONTROLLERS — HTTP LAYER</text>

    <rect x="60" y="192" width="100" height="30" rx="6" fill="rgba(37,99,235,0.1)"/>
    <text x="110" y="212" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">HubSpot</text>

    <rect x="170" y="192" width="110" height="30" rx="6" fill="rgba(37,99,235,0.1)"/>
    <text x="225" y="212" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">QuickBooks</text>

    <rect x="290" y="192" width="100" height="30" rx="6" fill="rgba(37,99,235,0.1)"/>
    <text x="340" y="212" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">Monday</text>

    <rect x="400" y="192" width="100" height="30" rx="6" fill="rgba(37,99,235,0.1)"/>
    <text x="450" y="212" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">ClickUp</text>

    <rect x="510" y="192" width="100" height="30" rx="6" fill="rgba(37,99,235,0.1)"/>
    <text x="560" y="212" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">Engine</text>

    <rect x="620" y="192" width="88" height="30" rx="6" fill="rgba(37,99,235,0.1)"/>
    <text x="664" y="212" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">Config</text>
  </g>

  <!-- Arrow -->
  <line x1="380" y1="234" x2="380" y2="258" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Services -->
  <g filter="url(#shadow)">
    <rect x="40" y="262" width="680" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="60" y="282" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">SERVICES — BUSINESS LOGIC</text>

    <rect x="60" y="294" width="100" height="30" rx="6" fill="rgba(124,58,237,0.1)"/>
    <text x="110" y="314" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Leads KPIs</text>

    <rect x="170" y="294" width="112" height="30" rx="6" fill="rgba(124,58,237,0.1)"/>
    <text x="226" y="314" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Finance KPIs</text>

    <rect x="292" y="294" width="112" height="30" rx="6" fill="rgba(124,58,237,0.1)"/>
    <text x="348" y="314" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Labor Router</text>

    <rect x="414" y="294" width="118" height="30" rx="6" fill="rgba(124,58,237,0.1)"/>
    <text x="473" y="314" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Monday Sync</text>

    <rect x="542" y="294" width="118" height="30" rx="6" fill="rgba(124,58,237,0.1)"/>
    <text x="601" y="314" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">ClickUp Sync</text>
  </g>

  <!-- Arrow -->
  <line x1="380" y1="336" x2="380" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Data -->
  <g filter="url(#shadow)">
    <rect x="40" y="364" width="680" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="60" y="384" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">DATA LAYER — PRISMA ORM</text>

    <rect x="60" y="396" width="140" height="30" rx="6" fill="rgba(22,163,74,0.1)"/>
    <text x="130" y="416" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Token Storage (x4)</text>

    <rect x="210" y="396" width="170" height="30" rx="6" fill="rgba(22,163,74,0.1)"/>
    <text x="295" y="416" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">KPI Cache (6hr TTL)</text>

    <rect x="390" y="396" width="120" height="30" rx="6" fill="rgba(22,163,74,0.1)"/>
    <text x="450" y="416" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">Org Config</text>

    <rect x="520" y="396" width="140" height="30" rx="6" fill="rgba(22,163,74,0.1)"/>
    <text x="590" y="416" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">User/Role Tables</text>
  </g>

  <!-- Bottom note -->
  <rect x="40" y="452" width="680" height="34" rx="8" fill="rgba(37,99,235,0.06)"/>
  <text x="380" y="474" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="500">Clean separation of concerns  |  Services are reusable across controllers, webhooks, and cron jobs  |  Pluggable design</text>
</svg>
